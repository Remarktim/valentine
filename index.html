<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>VALENTINE</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal.show {
        display: flex;
      }

      .button-animation {
        transition: all 0.3s ease;
      }

      .yes-button-grow {
        transform: scale(1.5);
        background-color: white;
        color: #ef4444;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body class="bg-red-500 h-auto">
    <section class="flex h-screen w-auto flex-col md:flex-row-reverse">
      <div class="bg-white h-100 margin-0 rounded-b-full md:rounded-b-none w-full md:rounded-l-full md:h-full md:w-1/2 relative">
        <img
          class="h-20 md:h-50 w-auto float-end rotate-30 m-10"
          src="img/heart.gif"
          alt="" />

        <div class="">
          <div class="h-70 md:h-90 w-60 md:w-100 mx-auto rounded-full shadow-2xl transform [perspective:75em] rotate-x-75 mr-[125] md:mr-50 mt-30 md:mt-100"></div>

          <img
            id="valentineGif"
            src="img/1.gif"
            alt="Valentine animation"
            class="absolute top-50 md:top-110 md-0 md:ml-20 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-auto h-40 md:h-80" />
        </div>
      </div>
      <div class="md:h-full md:w-1/2 h-auto w-auto mx-auto flex flex-col justify-center items-center">
        <div class="gap-2 h-150 w-120 md:w-140 bg-[url(/img/hearts.png)] bg-cover bg-center flex flex-col justify-center items-center">
          <div class="text-white text-center font-bold text-xl uppercase">Can you be my Valentine Date?</div>
          <div class="text-white text-center text-2xl">
            <button
              type="button"
              id="yesButton"
              onclick="handleYesClick()"
              class="button-animation p-1.5 px-5 border rounded-3xl hover:bg-white hover:text-red-500 transition-colors duration-300">
              YES
            </button>
            <button
              id="noButton"
              type="button"
              onclick="handleNoClick()"
              class="button-animation p-1.5 px-5 border rounded-3xl">
              NO
            </button>
          </div>
        </div>
      </div>
    </section>
    <div
      id="thankYouModal"
      class="modal">
      <div class="bg-white p-6 rounded-lg shadow-xl max-w-md mx-4">
        <div class="text-center">
          <h2 class="text-2xl font-bold text-red-500 mb-4">Thank You My Lovieee</h2>
          <p class="text-gray-700 mb-6">You've made me the happiest person! I know we are far away but I Love You.</p>
          <div class="mb-6">
            <img
              class="rounded-lg mx-auto w-64 h-64 object-cover"
              src="img/kiss.gif"
              alt="Valentine kiss" />
          </div>
          <button
            onclick="closeModal()"
            class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-colors">
            Close
          </button>
        </div>
      </div>
    </div>
    <script>
      const gifs = ["img/2.gif", "img/3.gif", "img/4.gif", "img/5.gif", "img/6.gif", "img/7.gif"];

      let currentGifIndex = 0;
      let noButtonScale = 1;
      let noClickCount = 0;

      function resetAll() {
        currentGifIndex = 0;
        noButtonScale = 1;
        noClickCount = 0;

        const noButton = document.getElementById("noButton");
        const yesButton = document.getElementById("yesButton");

        noButton.style.transform = "scale(1)";
        noButton.style.opacity = "1";
        noButton.style.display = "inline";

        yesButton.classList.remove("yes-button-grow");
        yesButton.style.transform = "scale(1)";

        const valentineGif = document.getElementById("valentineGif");
        valentineGif.src = "img/1.gif";
      }

      function handleNoClick() {
        const noButton = document.getElementById("noButton");
        const yesButton = document.getElementById("yesButton");
        const valentineGif = document.getElementById("valentineGif");

        currentGifIndex = (currentGifIndex + 1) % gifs.length;
        valentineGif.src = gifs[currentGifIndex];

        noClickCount++;

        noButtonScale = Math.max(0.1, 1 - noClickCount * 0.2);
        noButton.style.transform = `scale(${noButtonScale})`;
        noButton.style.opacity = noButtonScale;

        const yesScale = 1 + noClickCount * 0.1;
        yesButton.style.transform = `scale(${Math.min(yesScale, 1.5)})`;

        if (noClickCount >= 5) {
          noButton.style.display = "none";
        }
      }

      function handleYesClick() {
        const yesButton = document.getElementById("yesButton");
        const modal = document.getElementById("thankYouModal");

        yesButton.classList.add("yes-button-grow");

        setTimeout(() => {
          modal.classList.add("show");
        }, 100);
      }

      function closeModal() {
        const modal = document.getElementById("thankYouModal");
        modal.classList.remove("show");

        setTimeout(() => {
          resetAll();
        }, 100);
      }

      document.getElementById("thankYouModal").addEventListener("click", function (event) {
        if (event.target === this) {
          closeModal();
        }
      });
    </script>
  </body>
</html>
